events {}

http {
  server {
    listen 8080;

    location /api/auth/ {
      proxy_pass http://auth-service:8001/api/auth/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/upload/ {
      proxy_pass http://upload-service:8002/api/upload/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/quiz/ {
      proxy_pass http://quiz-service:8003/api/quiz/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/analytics/ {
      proxy_pass http://analytics-service:8004/api/analytics/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ai/ {
      proxy_pass http://ai-orchestrator:8005/api/ai/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
